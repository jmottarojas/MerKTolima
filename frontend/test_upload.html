<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test de Carga de Imágenes</h2>
        
        <form id="uploadForm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="imageFiles" class="form-label">Seleccionar Imágenes</label>
                <input type="file" class="form-control" id="imageFiles" multiple accept="image/*">
            </div>
            <button type="button" class="btn btn-primary" onclick="testUpload()">Subir Imágenes</button>
        </form>
        
        <div id="result" class="mt-3"></div>
        <div id="preview" class="mt-3 row"></div>
    </div>

    <script>
        function testUpload() {
            const fileInput = document.getElementById('imageFiles');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert('Selecciona al menos una imagen');
                return;
            }
            
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append(`image_${i}`, files[i]);
                console.log(`Archivo ${i}: ${files[i].name}, tipo: ${files[i].type}, tamaño: ${files[i].size}`);
            }
            
            // Mostrar preview
            const previewDiv = document.getElementById('preview');
            previewDiv.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const col = document.createElement('div');
                    col.className = 'col-md-3 mb-3';
                    col.innerHTML = `
                        <div class="card">
                            <img src="${e.target.result}" class="card-img-top" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <small>${file.name}</small><br>
                                <small>${(file.size / 1024 / 1024).toFixed(2)} MB</small>
                            </div>
                        </div>
                    `;
                    previewDiv.appendChild(col);
                };
                reader.readAsDataURL(file);
            }
            
            // Subir archivos
            fetch('/marketplace/api/upload-images/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
            .then(response => {
                console.log('Status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Respuesta:', data);
                const resultDiv = document.getElementById('result');
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>¡Éxito!</h5>
                            <p>Se subieron ${data.count} imágenes:</p>
                            <ul>
                                ${data.image_urls.map(url => `<li><a href="${url}" target="_blank">${url}</a></li>`).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h5>Error</h5>
                            <p>${data.error}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-danger">
                        <h5>Error</h5>
                        <p>${error.message}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
