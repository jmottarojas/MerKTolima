{% extends 'base.html' %}

{% block title %}Test Upload - Merktolima{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>Test de Carga de Imágenes</h2>
    
    <div class="card">
        <div class="card-body">
            <form id="uploadForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="imageFiles" class="form-label">Seleccionar Imágenes</label>
                    <input type="file" class="form-control" id="imageFiles" multiple accept="image/*">
                    <div class="form-text">Selecciona hasta 5 imágenes (máximo 5MB cada una)</div>
                </div>
                <button type="button" class="btn btn-primary" onclick="testUpload()">
                    <i class="fas fa-upload me-2"></i>Subir Imágenes
                </button>
            </form>
            
            <div id="result" class="mt-3"></div>
            <div id="preview" class="mt-3 row"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function testUpload() {
    const fileInput = document.getElementById('imageFiles');
    const files = fileInput.files;
    
    if (files.length === 0) {
        alert('Selecciona al menos una imagen');
        return;
    }
    
    console.log(`Subiendo ${files.length} archivos...`);
    
    const formData = new FormData();
    for (let i = 0; i < files.length; i++) {
        formData.append(`image_${i}`, files[i]);
        console.log(`Archivo ${i}: ${files[i].name}, tipo: ${files[i].type}, tamaño: ${files[i].size}`);
    }
    
    // Mostrar preview
    const previewDiv = document.getElementById('preview');
    previewDiv.innerHTML = '<div class="col-12"><h5>Vista Previa:</h5></div>';
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
            const col = document.createElement('div');
            col.className = 'col-md-3 mb-3';
            col.innerHTML = `
                <div class="card">
                    <img src="${e.target.result}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <small class="text-muted">${file.name}</small><br>
                        <small class="text-muted">${(file.size / 1024 / 1024).toFixed(2)} MB</small>
                    </div>
                </div>
            `;
            previewDiv.appendChild(col);
        };
        reader.readAsDataURL(file);
    }
    
    // Mostrar loading
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `
        <div class="alert alert-info">
            <i class="fas fa-spinner fa-spin me-2"></i>Subiendo archivos...
        </div>
    `;
    
    // Subir archivos
    fetch('/marketplace/api/upload-images/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => {
        console.log('Status:', response.status);
        console.log('Headers:', response.headers);
        return response.text().then(text => {
            try {
                return JSON.parse(text);
            } catch (e) {
                console.error('Respuesta no es JSON:', text);
                throw new Error(`Respuesta del servidor no válida: ${text.substring(0, 100)}`);
            }
        });
    })
    .then(data => {
        console.log('Respuesta:', data);
        
        if (data.success) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <h5><i class="fas fa-check-circle me-2"></i>¡Éxito!</h5>
                    <p>Se subieron ${data.count} imágenes correctamente:</p>
                    <ul class="mb-0">
                        ${data.image_urls.map(url => `<li><a href="${url}" target="_blank" class="text-decoration-none">${url}</a></li>`).join('')}
                    </ul>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="alert alert-danger">
                    <h5><i class="fas fa-exclamation-triangle me-2"></i>Error</h5>
                    <p>${data.error}</p>
                </div>
            `;
        }
    })
    .catch(error => {
        console.error('Error:', error);
        resultDiv.innerHTML = `
            <div class="alert alert-danger">
                <h5><i class="fas fa-exclamation-triangle me-2"></i>Error</h5>
                <p>${error.message}</p>
            </div>
        `;
    });
}
</script>
{% endblock %}
