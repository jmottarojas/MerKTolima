{% extends 'base.html' %}

{% block title %}Registrarse - Merktolima{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: var(--binotinto);">
                            <i class="fas fa-user-plus me-2"></i>Crear Cuenta
                        </h2>
                        <p class="text-muted">Únete a la comunidad Merktolima</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" 
                                       placeholder="Tu nombre" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label fw-semibold">Apellido</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" 
                                       placeholder="Tu apellido" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email" 
                                       placeholder="tu@email.com" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Mínimo 8 caracteres" required minlength="8">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="role" class="form-label fw-semibold">Tipo de cuenta</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="buyer">Comprador</option>
                                <option value="seller">Vendedor</option>
                            </select>
                            <div class="form-text">
                                Puedes cambiar tu rol más tarde desde tu perfil
                            </div>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus me-2"></i>Crear Cuenta
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="text-muted mb-0">
                            ¿Ya tienes cuenta? 
                            <a href="{% url 'marketplace:login' %}" class="text-decoration-none fw-semibold" 
                               style="color: var(--binotinto);">
                                Inicia sesión aquí
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
