<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Test CSRF - Actualización Estado Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1>Test CSRF - Actualización Estado Pedidos</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Información CSRF</h5>
                    </div>
                    <div class="card-body">
                        <div id="csrf-info">
                            <p><strong>CSRF Token desde Cookie:</strong> <span id="csrf-cookie">Cargando...</span></p>
                            <p><strong>CSRF Token desde Meta:</strong> <span id="csrf-meta">Cargando...</span></p>
                            <p><strong>CSRF Token desde Input:</strong> <span id="csrf-input">Cargando...</span></p>
                        </div>
                        
                        <form id="csrf-form">
                            {% csrf_token %}
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test de Actualización</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testUpdateStatus()">
                            Probar Actualización de Estado
                        </button>
                        
                        <div class="mt-3">
                            <h6>Log:</h6>
                            <div id="log" class="border p-2" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function log(message) {
        const logDiv = document.getElementById('log');
        const timestamp = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    }

    function getCSRFToken() {
        // 1. Desde input hidden
        var csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
        if (csrfInput) {
            log('✅ CSRF token encontrado en input hidden');
            return csrfInput.value;
        }
        
        // 2. Desde cookies
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === 'csrftoken=') {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    log('✅ CSRF token encontrado en cookie');
                    return cookieValue;
                }
            }
        }
        
        // 3. Desde meta tag
        var metaToken = document.querySelector('meta[name="csrf-token"]');
        if (metaToken) {
            log('✅ CSRF token encontrado en meta tag');
            return metaToken.getAttribute('content');
        }
        
        log('❌ CSRF token NO encontrado');
        return null;
    }

    function updateCSRFInfo() {
        // Cookie
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === 'csrftoken=') {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    break;
                }
            }
        }
        document.getElementById('csrf-cookie').textContent = cookieValue ? cookieValue.substring(0, 20) + '...' : 'No encontrado';
        
        // Meta tag
        var metaToken = document.querySelector('meta[name="csrf-token"]');
        document.getElementById('csrf-meta').textContent = metaToken ? metaToken.getAttribute('content').substring(0, 20) + '...' : 'No encontrado';
        
        // Input hidden
        var csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
        document.getElementById('csrf-input').textContent = csrfInput ? csrfInput.value.substring(0, 20) + '...' : 'No encontrado';
    }

    function testUpdateStatus() {
        log('🔄 Iniciando test de actualización de estado...');
        
        var csrfToken = getCSRFToken();
        
        if (!csrfToken) {
            log('❌ No se pudo obtener CSRF token');
            alert('Error: No se pudo obtener el token CSRF');
            return;
        }
        
        log('🔑 CSRF Token obtenido: ' + csrfToken.substring(0, 20) + '...');
        
        var data = {
            order_id: 'test-order-' + Date.now(),
            status: 'shipped'
        };
        
        log('📤 Enviando petición con datos: ' + JSON.stringify(data));
        
        fetch('/vendedor/pedidos/actualizar-estado/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify(data)
        })
        .then(function(response) {
            log('📥 Respuesta recibida - Status: ' + response.status + ' ' + response.statusText);
            
            if (!response.ok) {
                return response.text().then(function(text) {
                    throw new Error('HTTP ' + response.status + ': ' + text.substring(0, 200));
                });
            }
            
            return response.json();
        })
        .then(function(data) {
            log('📊 Respuesta JSON: ' + JSON.stringify(data));
            
            if (data.success) {
                log('✅ Actualización exitosa');
                alert('¡Actualización exitosa!');
            } else {
                log('❌ Error en actualización: ' + data.error);
                alert('Error: ' + data.error);
            }
        })
        .catch(function(error) {
            log('💥 Error en petición: ' + error.message);
            alert('Error: ' + error.message);
        });
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
        log('🚀 Página cargada');
        updateCSRFInfo();
    });
    </script>
</body>
</html>
