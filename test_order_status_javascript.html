<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="test-csrf-token">
    <title>Test - Actualización Estado Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1>Test - Actualización Estado Pedidos</h1>
        <p>Este archivo prueba que el JavaScript funciona correctamente sin errores.</p>
        
        <div class="card">
            <div class="card-body">
                <h5>Pedido #test-123</h5>
                <button class="btn btn-primary" onclick="updateOrderStatus('test-order-123', 'shipped')">
                    Marcar como Enviado
                </button>
            </div>
        </div>
        
        <div class="mt-3">
            <h6>Log de pruebas:</h6>
            <div id="log" class="border p-3" style="height: 200px; overflow-y: auto; background-color: #f8f9fa;"></div>
        </div>
    </div>

    <script>
    // Función para logging
    function log(message) {
        const logDiv = document.getElementById('log');
        const timestamp = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    }

    // Obtener CSRF token
    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Actualizar estado del pedido
    function updateOrderStatus(orderId, newStatus) {
        log(`🔄 Iniciando actualización de estado para pedido: ${orderId}`);
        log(`📋 Nuevo estado: ${newStatus}`);
        
        var statusText = '';
        if (newStatus === 'confirmed') statusText = 'confirmar';
        else if (newStatus === 'shipped') statusText = 'marcar como enviado';
        else if (newStatus === 'delivered') statusText = 'marcar como entregado';
        else if (newStatus === 'cancelled') statusText = 'cancelar';
        
        log(`💬 Texto de confirmación: ${statusText}`);
        
        if (confirm('¿Estás seguro de que quieres ' + statusText + ' este pedido?')) {
            log('✅ Usuario confirmó la acción');
            
            // Obtener CSRF token
            var csrfToken = getCookie('csrftoken');
            log(`🔑 CSRF token desde cookie: ${csrfToken ? 'Encontrado' : 'No encontrado'}`);
            
            if (!csrfToken) {
                // Intentar obtener del meta tag si existe
                var metaToken = document.querySelector('meta[name="csrf-token"]');
                if (metaToken) {
                    csrfToken = metaToken.getAttribute('content');
                    log(`🔑 CSRF token desde meta tag: ${csrfToken ? 'Encontrado' : 'No encontrado'}`);
                }
            }
            
            log(`🔑 CSRF token final: ${csrfToken || 'No disponible'}`);
            
            // Hacer petición al backend Django
            log('📤 Enviando petición al servidor...');
            
            fetch('/vendedor/pedidos/actualizar-estado/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ 
                    order_id: orderId, 
                    status: newStatus 
                })
            })
            .then(function(response) {
                log(`📥 Respuesta recibida - Status: ${response.status}`);
                return response.json();
            })
            .then(function(data) {
                log(`📊 Datos de respuesta: ${JSON.stringify(data)}`);
                
                if (data.success) {
                    log('✅ Estado del pedido actualizado exitosamente');
                    alert('Estado del pedido actualizado exitosamente');
                    // location.reload(); // Comentado para el test
                } else {
                    log(`❌ Error: ${data.error || 'Error desconocido'}`);
                    alert('Error al actualizar el estado del pedido: ' + (data.error || 'Error desconocido'));
                }
            })
            .catch(function(error) {
                log(`💥 Error en la petición: ${error}`);
                console.error('Error:', error);
                alert('Error al actualizar el estado del pedido');
            });
        } else {
            log('❌ Usuario canceló la acción');
        }
    }

    // Test inicial
    document.addEventListener('DOMContentLoaded', function() {
        log('🚀 Página cargada correctamente');
        log('🔍 Verificando elementos...');
        
        // Verificar que la función existe
        if (typeof updateOrderStatus === 'function') {
            log('✅ Función updateOrderStatus definida correctamente');
        } else {
            log('❌ Función updateOrderStatus NO definida');
        }
        
        // Verificar CSRF token
        var metaToken = document.querySelector('meta[name="csrf-token"]');
        if (metaToken) {
            log('✅ Meta tag CSRF encontrado');
        } else {
            log('❌ Meta tag CSRF NO encontrado');
        }
        
        log('🎯 Test listo - Haz clic en el botón para probar');
    });
    </script>
</body>
</html>
