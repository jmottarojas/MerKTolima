<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Completo del Carousel - Merkatolima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="frontend/static/css/carousel-styles.css">
    <style>
        .test-section {
            border: 2px solid #e9ecef;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .test-passed {
            border-color: #198754;
            background-color: #f8fff9;
        }
        .test-failed {
            border-color: #dc3545;
            background-color: #fff8f8;
        }
        .test-log {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-4 fw-bold text-center mb-4">
                    🎠 Test Completo del Carousel de Imágenes
                </h1>
                <p class="lead text-center text-muted">
                    Verificación exhaustiva de la funcionalidad del carousel implementado en Merkatolima
                </p>
            </div>
        </div>

        <!-- Test 1: Carousel Principal (Product Detail) -->
        <div class="test-section" id="test1">
            <h3>
                <span class="test-status">🔄</span>
                Test 1: Carousel Principal (Página de Detalle)
            </h3>
            <p class="text-muted">Carousel completo con indicadores, controles y miniaturas</p>
            
            <div class="row">
                <div class="col-lg-6">
                    <div id="productImageCarousel" class="carousel slide" data-bs-ride="carousel">
                        <!-- Indicadores -->
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#productImageCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Imagen 1"></button>
                            <button type="button" data-bs-target="#productImageCarousel" data-bs-slide-to="1" aria-label="Imagen 2"></button>
                            <button type="button" data-bs-target="#productImageCarousel" data-bs-slide-to="2" aria-label="Imagen 3"></button>
                            <button type="button" data-bs-target="#productImageCarousel" data-bs-slide-to="3" aria-label="Imagen 4"></button>
                            <button type="button" data-bs-target="#productImageCarousel" data-bs-slide-to="4" aria-label="Imagen 5"></button>
                        </div>
                        
                        <!-- Imágenes del carousel --
